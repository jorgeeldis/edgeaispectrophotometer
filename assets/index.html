<div class="card">
  <h2>Live Spectral Data</h2>
  <table class="table">
    <tr>
      <th>Channel</th>
      <th>Wavelength (nm)</th>
      <th>Value</th>
    </tr>
    <tbody id="sensor-display">
      <tr><td colspan="3">Connecting...</td></tr>
    </tbody>
  </table>
</div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>
  const socket = io();
  const wavelengths = [380, 395, 410, 435, 460, 485, 510, 535, 560, 585, 610, 645, 680, 705];

  socket.on("html_sensor_event", function(data) {
    const values = data.split(",");
    let html = "";
    
    for (let i = 0; i < 14; i++) {
      html += `<tr>
        <td>Ch${i}</td>
        <td>${wavelengths[i]}</td>
        <td>${values[i]}</td>
      </tr>`;
    }
    
    document.getElementById("sensor-display").innerHTML = html;
  });
</script>
