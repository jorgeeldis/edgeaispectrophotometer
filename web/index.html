<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Data Analysis Hub</title>
    <!-- Include App Lab UI Helper assets -->
    <script src="/sdk/arduino-webui.js"></script> 
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 30px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; }
        .metric { font-size: 24px; font-weight: bold; color: #007c89; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔬 Edge AI Analytics Control Panel</h2>
        <p>Sensor Reading: <span id="mcu-sensor" class="metric">0</span></p>
        <p>AI Classification: <span id="ai-status" class="metric">Waiting...</span></p>
        <p>Model Confidence: <span id="ai-conf">0%</span></p>
        <small>Last updated: <span id="time-stamp">-</span></small>
    </div>

    <script>
        // Connect automatically back to the App Lab application websocket stream
        const appLab = new ArduinoWebUI();

        appLab.on("data_update", (data) => {
            document.getElementById("mcu-sensor").innerText = data.sensor_reading;
            document.getElementById("ai-status").innerText = data.ai_result;
            document.getElementById("ai-conf").innerText = data.confidence;
            document.getElementById("time-stamp").innerText = data.timestamp;
        });
    </script>
</body>
</html>
